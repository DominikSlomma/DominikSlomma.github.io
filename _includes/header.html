{% if site.google_tag_manager %}
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager }}"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
{% endif %}

<nav class="navbar sticky-top navbar-expand-md navbar-dark bg-dark">
  <a class="navbar-brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/images/robot-icon.svg' | relative_url }}" width="30" height="30" style="margin-right:8px" class="d-inline-block align-top" alt="Robotics logo">
    {{ site.title | escape }}
  </a>

  <div class="navbar-actions ml-auto order-md-3">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
      <i class="fa fa-sun-o" aria-hidden="true"></i>
      <span class="visually-hidden" data-theme-toggle-label>Switch to light theme</span>
    </button>
    <button class="toggler navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>

  <div class="collapse navbar-collapse justify-content-center order-md-2" id="navbarColor02">
    <div class="navbar-nav">
      <a class="nav-item nav-link" href="{{ '/' | relative_url }}">Home</a>
      {% for page in site.nav_pages %}       
        <a class="nav-item nav-link" href="{{ '/' | append: page.name | relative_url }}">{{page.name | capitalize }}</a>
      {% endfor %}
    </div>
  </div>
</nav>
